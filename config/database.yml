default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DEV_DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DEV_DB_USER", "aly") %>
  password: <%= ENV.fetch("DEV_DB_PASSWORD", "mypassword") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: <%= ENV.fetch("DEV_DB_NAME", "blog_app_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("TEST_DB_NAME", "blog_app_test") %>

production:
  url: <%= ENV['DATABASE_URL'] %>
